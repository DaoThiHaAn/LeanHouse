  new_tel_owner:
    self: "Phone Number Verification Help"
    title: "Verify Phone Number"
    case_2: "Case 2: You are a landlord creating a new account for a Tenant"
    case_1: "Case 1: You are the owner of the phone number"
    content_1: "The notification indicates that the phone number is already registered, possibly by a previous owner. To verify ownership, please follow these steps:"
    content_2_html: "<em>Step 1</em>: Send an SMS to  <strong>1414</strong> (free customer service number for mobile carriers in Vietnam) with syntax <strong>TTTB [National ID / Citizen ID Number]</strong>"
    content_3_html: "<em>Step 2</em>: Take a screenshot of the sent message and carrier response as shown."
    content_4_html: "<em>Step 3</em>: Send an email to us at <a class='text-decoration-underline' target='_blank' rel='noopener noreferrer' href='mailto:customerservice@leanhouse.com?subject=Help with Phone Number Verification'>customerservice@leanhouse.com</a>. In the email, attach the screenshot from step 2."
    content_4_1_html: "(<strong>Note</strong>: Phone number and Citizen ID / National ID number must be clearly visible. All personal information provided will be kept confidential, used solely for verifying phone number ownership, and will not be shared with third parties.)"
    fig_caption: "Illustration of verification SMS and carrier response confirming genuine phone number ownership"
    content_5: "The verified phone number is the one confirmed by the carrier in the incoming SMS response."
    content_6: "We will process and respond within 1-2 business days (excluding Saturdays, Sundays, and holidays). If you haven't received an email, please check your Spam or Junk folder."
    content_7: "Please contact the Tenant and guide them through the above steps, or switch to a new phone number."

