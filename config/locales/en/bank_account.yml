      free_badge: "100% Free & Unlimited"
      supported_banks: "Supports: MB Bank, ACB, BIDV, OCB, KienlongBank"
      intro_title: "Instant auto-reconciliation in 1-3 seconds when tenant pays"
      intro_desc: "When tenants scan the VietQR code and transfer money, funds go directly into your bank account. The system automatically marks invoices as 'Paid' instantly without requiring you to check banking statements or manually approve payments."
      steps_title: "4 Simple Setup Steps (Takes only 3 minutes)"
      step1_title: "Register a payOS Account"
      step1_desc: "Access the payOS developer portal and sign up for a completely free account."
      step1_btn: "Visit my.payos.vn"
      step2_title: "Link Your Bank Account"
      step2_desc: "In the payOS dashboard, navigate to 'Bank Accounts' -> 'Add Account' and link your bank account (MB Bank, ACB, BIDV, OCB, or KienlongBank) following the on-screen instructions."
      step3_title: "Create Payment Channel & Obtain API Keys"
      step3_desc: "Go to 'Payment Channels' -> 'Create Channel', select the bank account linked in Step 2. Once created, you will receive three secure credentials:"
      step4_title: "Configure Webhook URL on payOS"
      step4_desc: "On the Payment Channel details page in payOS, locate 'Webhook Configuration' and paste the following URL:"
      step4_confirm_hint: "After pasting the link, click \"Confirm Webhook\" on payOS to complete connection."
      copy_btn: "Copy"
      copied_btn: "Copied!"
      dev_env_warning_title: "Development Server Notice (Localhost / 127.0.0.1):"
      dev_env_warning_prod_note_html: "• <strong>Production Environment:</strong> This Webhook link will <em>automatically resolve to your official domain</em> (e.g. <code>https://yourdomain.com/webhooks/payos</code>)."
      dev_env_warning_local_note_html: "• <strong>When running locally:</strong> payOS cloud servers cannot reach internal <code>127.0.0.1</code> IPs. Use ngrok (<code>ngrok http 3000</code>) or configure <code>PAYOS_WEBHOOK_URL</code> to test webhooks locally."
      prod_env_ready: "Webhook URL automatically resolved according to current Production domain."
      notes_title: "Frequently Asked Questions"
      faq1_q: "• Does payOS hold my money?"
      faq1_a: "No. payOS operates on an Account-to-Account (A2A) model. Rent transfers directly 100% into your bank account, without intermediate wallets or transaction fees."
      faq2_q: "• What if I use other banks (Techcombank, Vietcombank,...)?"
      faq2_a: "You can still add your account as usual. The system will use standard static VietQR, tenants scan to pay, and you approve payments as before."
      faq3_q: "• How does the Webhook URL change between Local and Production?"
      faq3_a: "The system automatically uses the application's actual domain when running on Production (e.g., https://yourdomain.com/webhooks/payos). Simply copy the exact URL shown here."
      security_footer: "Your API keys are stored securely within the system."
      btn_got_it: "Got it, proceed with setup"
    errors:
      payos_unsupported_bank: "This bank is currently not supported for payOS automated reconciliation."
