      btn_title: "Services & Usage Guide"
      modal_title: "Guide: Service Management & Usage Logging"
      badge_subtitle: "Standard workflow from service setup to invoice settlement"
      tab_create: "Create & Setup Services"
      tab_log: "Record & Confirm Usage"
      tab_workflow: "Invoicing Integration"
      tab_tips: "Tips & Best Practices"
      step1_title: "1. Create a New Service"
      step1_desc: "Click 'Add service' in the sidebar to create a service category (Electricity, Water, WiFi, Trash, Elevator...). Each service acts as a parent category for pricing and billing."
      step2_title: "2. Configure Service Variants"
      step2_desc: "Each service can have one or more variants depending on how it is calculated:\n• Real-time meter readings (kWh for electricity, m³ for water).\n• Fixed monthly fee (per person, per room, or per usage cycle)."
      step3_title: "3. Assign Room Scope"
      step3_desc: "When creating or editing a variant, choose whether it applies to all rooms in the house or only specific rooms/floors (e.g., rooms with air conditioners have a different electricity rate)."
      step4_title: "4. Manage & Update Pricing"
      step4_desc: "Easily adjust unit fees, units of measurement, or add new pricing variants at any time. Price updates apply to upcoming billing cycles without affecting historical records."
      log_step1_title: "1. Access Meter Tracking"
      log_step1_desc: "On any metered service card (Electricity/Water), click 'Track Meter Logs' (meter icon) to view and manage monthly meter readings across the house."
      log_step2_title: "2. Filter by Floor & Room (Optimized UX)"
      log_step2_desc: "Use the filter toolbar to select Month, then choose Floor to instantly narrow down the rooms on that floor. View all rooms on that floor or inspect a specific room."
      log_step3_title: "3. Record New Reading & Attach Photo"
      log_step3_desc: "Click 'Record new reading' and enter the latest meter reading. The system calculates consumption (Latest - Previous) and total cost automatically. Attach a photo for transparent verification with tenants."
      log_step4_title: "4. Confirm & Lock Readings"
      log_step4_desc: "Review readings and click 'Confirm' for individual rooms or 'Confirm all' for the entire house. Confirmed readings are immediately ready to be pulled into room invoices."
      workflow_title: "Monthly Operational Workflow"
      workflow_step1: "1. Cycle End: Tenant or Landlord records meter readings and submits photos."
      workflow_step2: "2. Review & Confirm: Landlord verifies readings against photos and confirms them."
      workflow_step3: "3. Automated Invoicing: When generating invoices, confirmed service usages are automatically populated into each room's invoice without manual data entry."
      workflow_step4: "4. Tamper Protection: Once billed, usage logs are locked in 'Billed' status to ensure complete audit integrity."
      tips_title: "Helpful Tips for Landlords"
      tip1_title: "Tenant Self-Reporting"
      tip1_desc: "Tenants can log into the Tenant Portal to photograph and submit their own monthly readings, saving landlords time."
      tip2_title: "Detect Abnormal Usage"
      tip2_desc: "If consumption spikes unexpectedly compared to the previous month, review the meter photo before confirming to catch water leaks or meter typos early."
      tip3_title: "Per-Person Services"
      tip3_desc: "For services billed per person (e.g., water at 100k/person), the system multiplies by the active tenant count in that room's contract automatically."
