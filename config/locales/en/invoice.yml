    billing_month_modal_title: "Billing Month & Billing Cycle Rules"
    billing_cycle_title: "1. Billing Cycle & Categorization"
    billing_cycle_desc: "Billing Month (e.g. 2026-09) serves as the primary accounting cycle anchor to track revenue, organize monthly invoice lists, and prevent duplicate invoices for the same room."
    rent_vs_service_title: "2. Rent (Prepaid) vs. Utilities (Postpaid)"
    rent_vs_service_desc: "• Room Rent: Typically billed in advance for the selected month (e.g. Sep 1 to Sep 30).\n• Metered Utilities (Electricity/Water): Billed in arrears for actual consumption over the past cycle (e.g. August electricity consumption settled in early September)."
    auto_meter_sync_title: "3. Automatic Latest Meter Log Sync"
    auto_meter_sync_desc: "The system automatically retrieves the most recent meter reading log recorded on or before this month. You can also adjust or input readings directly in the table below without visiting the meter logs page first."
    qr_code_sync_title: "4. Invoice Code & VietQR Integration"
    qr_code_sync_desc: "The billing month is automatically embedded into the invoice code (e.g. HD26092026-...) and the VietQR transfer description for automated payment reconciliation."
    guide:
      btn_title: "Invoice Creation Guide"
      modal_title: "Landlord Handbook: Invoice Creation & Billing Workflow"
      badge_subtitle: "Standard SaaS Workflow • Transparent • Automated VietQR"
      tab_steps: "📋 4-Step Process"
      tab_prepaid_postpaid: "💡 Prepaid vs. Postpaid"
      tab_modes: "👥 Payment Modes"
      tab_vietqr: "🏦 Automated VietQR"
      step1_title: "Step 1: Billing Month, Title & Target Room"
      step1_desc: "• Invoice Title: Give a descriptive purpose (default: Monthly Rent & Utilities).\n• Billing Month: Choose the accounting cycle (e.g. 09/2026).\n• Room & Mode: Select target room and billing mode (Whole Room or Separate Individual/Bed).\n• Due Date: Set payment deadline for tenants."
      step2_title: "Step 2: Review Rent & Meter Readings"
      step2_desc: "• Room Rent: Auto-calculated from room or bed rental unit pricing.\n• Utilities (Electricity/Water): Auto-fetches latest recorded readings. If unrecorded, type current meter readings directly into the form."
      step3_title: "Step 3: Dynamic Surcharges (+) & Discounts (-)"
      step3_desc: "• Surcharges (+): Click '+ Add Extra Fee' for ad-hoc costs (repairs, extra parking, penalties).\n• Discounts (-): Click '+ Add Discount' for deductions (promotions, deposit offset, seasonal relief).\n• Units: Select appropriate built-in units from the dropdown."
      step4_title: "Step 4: Select Bank Account & Issue Invoice"
      step4_desc: "• Bank Account: Select your bank account to generate a dynamic Napas 247 VietQR code with exact amount and automatic transfer description.\n• Click 'Issue Invoice': Freezes invoice immutably and notifies tenants."
      prepaid_postpaid_title: "Principle: Rent (Prepaid) vs. Utilities (Postpaid)"
      prepaid_postpaid_p1: "In rental property management, charges operate on distinct timing cycles:"
      prepaid_point: "Room Rent: Typically prepaid in advance for the upcoming month (e.g. billed on Sep 1-5 for Sep 1 to Sep 30)."
      meter_sync_point: "Auto-Log Sync: When creating a September invoice, the system automatically pulls the latest meter log on or before September."
      scenario_title: "Practical Guide: Common Invoice Creation Timing"
      scenario_badge: "Operational Guide"
      scenario_subtitle: "The system seamlessly supports both common monthly billing workflows used by landlords:"
      scenario_beginning_title: "Case 1: Creating Invoices at the BEGINNING of the Month (e.g. Sep 1 - 5 - Most Optimal)"
      scenario_beginning_badge: "100% Automated • Zero Month Adjustments"
      scenario_beginning_desc: "• <strong>Core Principle</strong>: Prepay September room rent (Sep 1 - Sep 30) while settling actual August metered utilities (Aug 1 - Aug 31) in arrears.\n• <strong>System Logic</strong>: Because it is early September, the 'Billing Month' field automatically defaults to <strong>09/2026</strong>. Room rent is billed for September, while electricity and water automatically fetch the recently finalized August meter log (the latest log on or before September) with the actual August usage period noted.\n• <strong>Action</strong>: Open the Create Invoice page (retain the default September month) ➔ Select room ➔ Review auto-populated line items ➔ Click 'Issue Invoice'."
      scenario_monthend_title: "Case 2: Creating Invoices at the END of the Month (e.g. August 31st)"
      scenario_monthend_badge: "Early Month-End Settlement"
      scenario_monthend_desc: "When August utilities have just been finalized on August 31st and you want to issue invoices on that day, you have two options:\n• <strong>Option A (Recommended - Prepaid Rent)</strong>: In 'Billing Month', switch from August to <strong>09/2026</strong>. The system bills September room rent while pulling the finalized August meter readings into the invoice.\n• <strong>Option B (Package Settlement for August)</strong>: Keep the default <strong>08/2026</strong> cycle. The system settles both August room rent and August metered utilities together."
      scenario_lock_title: "Automatic Meter Locking & Data Integrity Upon Issuance"
      scenario_lock_desc: "Upon clicking 'Issue Invoice', the associated meter usage logs are automatically linked to the invoice and locked from edits or deletion. If you type readings directly into the invoice creation form without a prior meter log, the system will automatically create and confirm a matching service usage log record for that room."
      modes_title: "2 Invoice Types & Payment Modes in the System"
      type_room_title: "1. Room & Service Invoices (Monthly Cycle)"
      type_room_desc: "Includes regular room rent, actual metered electricity/water usage, and fixed room services."
      has_2_payment_modes: "2 payment modes available"
      mode_room_title: "Room Representative Mode"
      mode_room_point: "Issues 1 total invoice for the entire room. The primary representative settles rent and shared utilities."
      mode_individual_title: "Self-pay Mode"
      mode_individual_point: "Issues separate invoices for each tenant (or bed). Rent and shared utilities are automatically divided equally among active occupants."
      mode_individual_room_split_note: "Note: For shared rooms (room mode), when selecting Self-pay mode, room rent and utilities are automatically divided equally among active occupants."
      type_custom_title: "2. Custom Fee Invoices (Ad-hoc Billing)"
      type_custom_desc: "Designed for ad-hoc or separate charges (repairs, penalties, refunds, security deposit adjustments...)."
      custom_pays_individually: "Each individual pays for themselves"
      custom_mode_heading: "Payment Mode: Each individual pays their own bill"
      mode_custom_point: "Landlords can select any tenants across the property without being tied to room rent or metered utilities. The system issues a separate invoice with its own VietQR code for each selected tenant to pay individually."
      mode_custom: "Custom Fees"
      mode_custom_desc: "Arbitrary tenants & custom fees"
      vietqr_title: "Automated Payment & Reconciliation with VietQR"
      vietqr_point1: "Dynamic QR: Each invoice embeds a standard Napas 247 VietQR code with exact total amount."
      vietqr_point2: "Automatic Transfer Note: Generates standard format (e.g. HD26092026-101-ABCD) for instantaneous zero-error matching."
      vietqr_point3: "Instant Settlement: Eliminates manual banking cross-checks."
      payos_realtime_title: "Real-Time Auto-Reconciliation via payOS (100% Free)"
      payos_realtime_desc: "If you use MB Bank, ACB, BIDV, OCB, or KienlongBank accounts and enable payOS integration, the entire payment confirmation process runs completely automatically:"
      payos_new_badge: "New"
      payos_bullet_1: "Tenants scan the VietQR code and complete the transfer in their banking app."
      payos_bullet_2_html: "The system receives an instant webhook (1-3 seconds) and <strong>automatically marks the invoice as \"Paid\"</strong>."
      payos_bullet_3_html: "Both you and the tenant receive instant confirmation notifications without you needing to <strong>open your banking app to check statements or manually approve payments</strong>."
      payos_activation_hint_html: "To activate: Go to <strong>Bank Account Settings</strong> ➔ Enable <em>\"Enable auto-reconciliation via payOS\"</em>."
      btn_got_it: "Start Creating Invoice"
    example: "Illustration on invoice:"
    realtime_usage_title: "1. Metered Services (Real-time Usage)"
    realtime_usage_desc: "Includes all services with dedicated meters (e.g. Electricity, Water, Gas, EV Charging, Hot Water...). Usage is calculated as:"
    fixed_usage_title: "2. Fixed Rate Services"
    fixed_usage_desc: "- Per Person: Multiplied by the number of active tenants staying in the room.\n- Per Room: Flat rate for the entire room.\n- Per Month: Fixed flat rate per monthly billing cycle.\n- Per Item / Quantity: Multiplied by the number of registered items, assets, or vehicles.\n- Per Hour: Calculated based on actual hours used or registered hourly quota.\n- Per Use: Calculated per occurrence or service usage count in the billing cycle.\n- Per kWh: Calculated based on electricity consumption (metered or fixed quota).\n- Per m³: Calculated based on water or gas consumption volume (metered or fixed quota)."
    individual_split_title: "3. Individual Mode Allocation"
    individual_split_desc: "When splitting bills individually in shared rooms, shared metered utilities are divided equally among staying roommates."
    service_instructions_subtitle: "Rules for calculating consumption, rates, and service billing cycles"
    usage_period_title: "4. Service Usage Period Determination Rules"
    usage_period_desc: "Every service item on the invoice displays an explicit date range (e.g. 01/09/2026 → 30/09/2026) following this 3-tier priority sequence:"
    usage_period_tier1_badge: "Priority 1"
    usage_period_tier1_title: "Actual Meter Reading Cycle (Electricity, Water)"
    usage_period_tier1_desc: "If a meter reading log exists, the period matches the exact recording dates from that cycle."
    usage_period_tier1_example: "Example: Electricity meter read from Aug 5 to Sep 5 → Invoice displays: 05/08/2026 → 05/09/2026"
    usage_period_tier2_badge: "Priority 2"
    usage_period_tier2_title: "Mid-Month Move-In (Prorated Daily Invoices)"
    usage_period_tier2_desc: "If a tenant moves in mid-month, the usage period starts from their move-in date until the month end."
    usage_period_tier2_example: "Example: Tenant moves in on Sep 15 → Invoice displays: 15/09/2026 → 30/09/2026"
    usage_period_tier3_badge: "Priority 3"
    usage_period_tier3_title: "Full Billing Month (Fixed Services: Wifi, Cleaning, Parking)"
    usage_period_tier3_desc: "Fixed monthly services default to covering the 1st through the final day of the billing month."
    usage_period_tier3_example: "Example: September 2026 invoice → Invoice displays: 01/09/2026 → 30/09/2026"
    snapshot_note_title: "Financial Snapshot Immutability"
    snapshot_note_desc: "Once an invoice is issued, all meter readings and usage periods are permanently snapshot-frozen into the invoice. Subsequent edits in usage logs will never alter historic issued invoices, ensuring accounting integrity."
    unconfirmed_realtime_title: "5. Handling Unconfirmed or Missing Meter Readings when Creating Invoices"
    unconfirmed_realtime_desc: "The system provides a seamless 1-step review and approval flow directly inside the draft invoice:"
    unconfirmed_case_pending_title: "Reading submitted but not yet confirmed (Pending Approval)"
    unconfirmed_case_pending_desc: "The draft automatically prefills the submitted readings for review. When the landlord clicks 'Issue Invoice', the system automatically approves and locks the log (Auto-confirm) without requiring a separate confirmation step."
    unconfirmed_case_missing_title: "No meter reading recorded yet for the month"
    unconfirmed_case_missing_desc: "• Enter on the fly: Landlords can type the latest reading directly into the invoice table, which automatically creates a confirmed log.\n• Postpone: Uncheck the service box to issue rent first; the utility fee remains unbilled for the subsequent cycle."
