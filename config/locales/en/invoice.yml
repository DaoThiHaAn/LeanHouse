    billing_month_info_title: "Understanding Billing Month"
    billing_month_modal_title: "Billing Month & Billing Cycle Rules"
    billing_cycle_title: "1. Billing Cycle & Categorization"
    billing_cycle_desc: "Billing Month (e.g. 2026-09) serves as the primary accounting cycle anchor to track revenue, organize monthly invoice lists, and prevent duplicate invoices for the same room."
    rent_vs_service_title: "2. Rent (Prepaid) vs. Utilities (Postpaid)"
    rent_vs_service_desc: "• Room Rent: Typically billed in advance for the selected month (e.g. Sep 1 to Sep 30).\n• Metered Utilities (Electricity/Water): Billed in arrears for actual consumption over the past cycle (e.g. August electricity consumption settled in early September)."
    auto_meter_sync_title: "3. Automatic Latest Meter Log Sync"
    auto_meter_sync_desc: "The system automatically retrieves the most recent meter reading log recorded on or before this month. You can also adjust or input readings directly in the table below without visiting the meter logs page first."
    qr_code_sync_title: "4. Invoice Code & VietQR Integration"
    qr_code_sync_desc: "The billing month is automatically embedded into the invoice code (e.g. HD2609-...) and the VietQR transfer description for automated payment reconciliation."
    guide:
      btn_title: "Invoice Creation Guide"
      modal_title: "Landlord Handbook: Invoice Creation & Billing Workflow"
      badge_subtitle: "Standard SaaS Workflow • Transparent • Automated VietQR"
      tab_steps: "📋 4-Step Process"
      tab_prepaid_postpaid: "💡 Prepaid vs. Postpaid"
      tab_modes: "👥 Room vs. Individual"
      tab_vietqr: "🏦 Automated VietQR"
      step1_title: "Step 1: Billing Month, Title & Target Room"
      step1_desc: "• Invoice Title: Give a descriptive purpose (default: Monthly Rent & Utilities).\n• Billing Month: Choose the accounting cycle (e.g. 09/2026).\n• Room & Mode: Select target room and billing mode (Whole Room or Separate Individual/Bed).\n• Due Date: Set payment deadline for tenants."
      step2_title: "Step 2: Review Rent & Meter Readings"
      step2_desc: "• Room Rent: Auto-calculated from room or bed rental unit pricing.\n• Utilities (Electricity/Water): Auto-fetches latest recorded readings. If unrecorded, type current meter readings directly into the form."
      step3_title: "Step 3: Dynamic Surcharges (+) & Discounts (-)"
      step3_desc: "• Surcharges (+): Click '+ Add Extra Fee' for ad-hoc costs (repairs, extra parking, penalties).\n• Discounts (-): Click '+ Add Discount' for deductions (promotions, deposit offset, seasonal relief).\n• Units: Select appropriate built-in units from the dropdown."
      step4_title: "Step 4: Select Bank Account & Issue Invoice"
      step4_desc: "• Bank Account: Select your bank account to generate a dynamic Napas 247 VietQR code with exact amount and automatic transfer description.\n• Click 'Issue Invoice': Freezes invoice immutably and notifies tenants."
      prepaid_postpaid_title: "Principle: Rent (Prepaid) vs. Utilities (Postpaid)"
      prepaid_postpaid_p1: "In rental property management, charges operate on distinct timing cycles:"
      prepaid_point: "Room Rent: Typically prepaid in advance for the upcoming month (e.g. billed on Sep 1-5 for Sep 1 to Sep 30)."
      postpaid_point: "Utilities (Electricity/Water): Postpaid in arrears for actual consumption during the past cycle (e.g. August power usage settled in early September)."
      meter_sync_point: "Auto-Log Sync: When creating a September invoice, the system automatically pulls the latest meter log on or before September."
      modes_title: "Modes: Whole Room vs. Individual Tenant"
      mode_room_point: "Room Mode: Issues 1 total invoice for the entire room. The primary tenant settles rent and total shared utilities."
      mode_individual_point: "Individual Mode (Dorm/Shared): Issues separate invoices per tenant. Rent matches individual bed pricing (bed mode) or is split equally among active occupants (room mode), and shared utilities are divided equally among staying occupants."
      mode_individual_room_split_note: "Important note: For shared rooms (room mode), when issuing individual invoices, room rent is automatically divided equally among the active tenants currently staying in the room."
      vietqr_title: "Automated Payment & Reconciliation with VietQR"
      vietqr_point1: "Dynamic QR: Each invoice embeds a standard Napas 247 VietQR code with exact total amount."
      vietqr_point2: "Automatic Transfer Note: Generates standard format (e.g. HD2609-101-ABCD) for instantaneous zero-error matching."
      vietqr_point3: "Instant Settlement: Eliminates manual banking cross-checks."
      btn_got_it: "Start Creating Invoice"
    realtime_usage_title: "1. Metered Services (Real-time Usage)"
    realtime_usage_desc: "Includes all services with dedicated meters (e.g. Electricity, Water, Gas, EV Charging, Hot Water...). Usage is calculated as:"
    fixed_usage_title: "2. Fixed Rate Services"
    fixed_usage_desc: "- Per Room/Month: Flat fee for the room (e.g. Internet Wifi).\n- Per Person: Multiplied by active tenants count (e.g. Trash/Cleaning).\n- Per Item: Multiplied by registered vehicles (e.g. Parking)."
    individual_split_title: "3. Individual Mode Allocation"
    individual_split_desc: "When splitting bills individually in shared rooms, shared metered utilities are divided equally among staying roommates."
