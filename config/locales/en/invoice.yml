      modal_title: "Tenant Invoice & Payment Guide"
      badge_subtitle: "Transparent Billing • Clear Cycles • Fast VietQR Payment"
      tab_timing: "💡 Billing Month & Cycle"
      tab_modes: "👥 2 Invoice Types & Payment Modes"
      tab_vietqr: "🏦 VietQR Payment & Confirmation"
      timing_title: "Billing Cycle Principle: Rent (Prepaid) vs. Utilities (Postpaid)"
      timing_p1: "In property management, charges typically follow distinct timing cycles to ensure transparency. However, <strong>the exact billing date and cycle depend entirely on your Landlord's policy and your lease contract</strong>:"
      timing_rent_title: "Room Rent: Typically Prepaid (In advance)"
      timing_rent_desc: "Most commonly collected at the beginning of the month for occupancy during that month (e.g., an invoice in early September covers room rent from Sep 1 to Sep 30)."
      timing_utility_title: "Electricity, Water & Metered Utilities: Typically Postpaid (In arrears)"
      timing_utility_desc: "Billed after actual consumption based on finalized meter readings of the previous cycle (e.g., an invoice in early September charges for electricity and water used in August)."
      scenario_title: "Common Invoice Delivery Timelines from Landlords"
      scenario_badge: "Practical Cycles"
      scenario_subtitle: "Depending on your landlord's operating workflow or lease contract terms, you will usually receive invoices in one of two scenarios:"
      scenario_beginning_title: "Scenario 1: Invoiced at the BEGINNING OF THE MONTH (e.g. 1st - 5th • Most Common)"
      scenario_beginning_badge: "Offset Cycle"
      scenario_beginning_desc: "• <strong>Structure</strong>: Includes prepaid room rent for the upcoming month (Sep 1 - Sep 30) alongside postpaid utility fees for the month just ended (Aug 1 - Aug 31).\n• <strong>How to verify</strong>: Check the 'From - To' date columns on each line item to see the exact coverage period."
      scenario_monthend_title: "Scenario 2: Invoiced at the END OF THE MONTH (e.g. 30th - 31st)"
      scenario_monthend_badge: "Month-End Billing"
      scenario_monthend_desc: "• <strong>Structure</strong>: The landlord finalizes meter readings at the end of the month and issues the invoice immediately. Depending on property rules, this may include next month's prepaid rent or a consolidated settlement for the concluded month.\n• <strong>Note</strong>: All fee periods are clearly stated on each line item of your invoice."
      cycle_dependency_title: "Important Note on Billing Cycles & Dates"
      cycle_dependency_desc: "While LeanHouse provides tools for transparent billing, <strong>the exact invoice release date, payment due date, and billing cycle are determined by your Landlord according to your lease agreement</strong>. You can always verify the exact period ('From - To') listed for each fee item on your invoice."
      timing_meter_title: "Transparent Meter Reading Breakdown"
      timing_meter_desc: "The invoice breakdown explicitly displays: <strong>Previous reading</strong>, <strong>Current reading</strong>, and <strong>Actual consumption</strong> (= Current - Previous) alongside the unit rate for easy meter cross-checking."
      modes_title: "2 Invoice Types & Payment Modes"
      type_room_title: "1. Room & Service Invoices (Monthly Cycle)"
      type_room_desc: "Covers recurring monthly room rent and shared utility services."
      mode_representative_title: "Room Representative Mode"
      mode_representative_desc: "Issues 1 total invoice for the room. The room representative settles the full amount on behalf of the room."
      mode_self_pay_title: "Self-pay Mode"
      mode_self_pay_desc: "Each tenant receives their own separate invoice. Room rent and shared utilities are divided equally among staying occupants."
      type_custom_title: "2. Custom Fee Invoices (Ad-hoc Billing)"
      type_custom_desc: "Used for ad-hoc charges outside the regular room cycle (extra parking, repairs, penalties, deposit adjustments, refunds...)."
      custom_mode_desc: "Issued individually to you with a distinct invoice code and unique VietQR code to settle your specific fee."
      vietqr_title: "Simple 2-Step Payment & Confirmation Process"
      vietqr_step1_title: "Step 1: Scan VietQR with any Banking App"
      vietqr_step1_desc: "Open your mobile banking app, choose 'Scan QR', and scan the VietQR on the invoice. Exact payment amount and transfer note are pre-filled automatically.\n<strong>Note:</strong> Please do not alter the transfer note so your payment can be matched immediately."
      vietqr_step2_title: "Step 2: Click 'Confirm Payment' on LeanHouse"
      vietqr_step2_desc: "After transferring, return to the invoice and click <strong>'Confirm Payment'</strong>. You can optionally attach a transaction proof screenshot for quick landlord verification."
      payos_realtime_title: "Instant Auto-Confirmation (Real-Time)"
      payos_realtime_desc: "For invoices displaying the payOS badge, the invoice automatically switches to 'Paid' within 1-3 seconds after transfer without requiring you to manually confirm or upload receipts!"
      payos_intro_html: "For invoices marked with the %{badge} badge, immediately after you complete the bank transfer on your mobile banking app:"
      payos_bullet_1_html: "The system will <strong>automatically verify payment within 1-3 seconds</strong>."
      payos_bullet_2_html: "The invoice page will immediately update to <strong>\"Paid\"</strong> status without needing a page refresh or uploading transfer receipts."
      payos_note_html: "*Note: The QR code displayed on the invoice is a static VietQR. To be automatically confirmed in real-time via payOS, please open the payOS checkout link."
      btn_close: "Got it"
