      applied_rate: "Áp dụng: %{applied}/%{total} phòng"
      fixed: "Cố định"
      real_time_badge: "Đo thực tế"
      eligible_rooms_info: "Màn hình chỉ hiển thị các phòng chưa áp dụng phiên bản khác của dịch vụ này."
      no_eligible_rooms: "Tất cả phòng trong nhà đã được liên kết với các phiên bản khác của dịch vụ này."
      notify_tenants: "Gửi thông báo cập nhật cho khách thuê đang ở các phòng bị ảnh hưởng"
      select_all: "Chọn tất cả"
    guide:
      btn_title: "Hướng dẫn Dịch vụ & Chỉ số"
      modal_title: "Cẩm nang: Quản lý Dịch vụ & Ghi nhận Chỉ số"
      badge_subtitle: "Quy trình chuẩn hóa từ thiết lập dịch vụ đến chốt hóa đơn thu tiền"
      tab_create: "Tạo & Cài đặt Dịch vụ"
      tab_log: "Ghi nhận & Duyệt Chỉ số"
      tab_workflow: "Liên kết Hóa đơn"
      tab_tips: "Mẹo & Lưu ý"
      step1_title: "1. Tạo Dịch vụ mới"
      step1_desc: "Bấm nút 'Thêm dịch vụ' ở thanh bên để tạo loại dịch vụ (Điện, Nước, WiFi, Rác, Thang máy...). Mỗi dịch vụ đóng vai trò là danh mục chính để quản lý định mức và tính tiền."
      step2_title: "2. Thiết lập Biến thể (Service Variant)"
      step2_desc: "Mỗi dịch vụ có thể có một hoặc nhiều biến thể tùy theo cách tính:\n• Đo theo công tơ thực tế (kWh cho điện, m³ cho nước).\n• Phí cố định hàng tháng (theo đầu người, theo phòng, hoặc tính theo lượt sử dụng)."
      step3_title: "3. Phân bổ phạm vi phòng áp dụng"
      step3_desc: "Khi tạo hoặc sửa biến thể dịch vụ, bạn có thể chọn áp dụng cho toàn bộ các phòng trong nhà trọ, hoặc chỉ áp dụng cho từng phòng/tầng cụ thể (ví dụ: phòng có máy lạnh tính giá điện khác)."
      step4_title: "4. Quản lý & Cập nhật đơn giá"
      step4_desc: "Dễ dàng chỉnh sửa đơn giá, đơn vị tính, hoặc thêm biến thể giá mới bất cứ lúc nào. Việc cập nhật giá sẽ áp dụng cho các kỳ hóa đơn tiếp theo mà không làm sai lệch số liệu cũ."
      log_step1_title: "1. Truy cập trang Theo dõi chỉ số"
      log_step1_desc: "Tại thẻ dịch vụ đo lường (Điện/Nước), bấm nút 'Theo dõi chỉ số' (biểu tượng công tơ) để vào màn hình ghi nhận chỉ số định kỳ của toàn nhà."
      log_step2_title: "2. Chọn Tầng & Phòng (UX Tối ưu)"
      log_step2_desc: "Thanh công cụ cho phép lọc theo Tháng, sau đó chọn Tầng để thu hẹp nhanh danh sách phòng trên tầng đó. Bạn có thể xem toàn bộ phòng trên tầng hoặc chọn từng phòng cụ thể để ghi chỉ số."
      log_step3_title: "3. Ghi chỉ số mới & Đính kèm ảnh"
      log_step3_desc: "Bấm 'Ghi chỉ số mới', nhập chỉ số hiện tại. Hệ thống tự động tính số lượng tiêu thụ (Chỉ số mới - Chỉ số cũ) và thành tiền. Đính kèm ảnh chụp công tơ thực tế để tăng tính minh bạch với khách thuê."
      log_step4_title: "4. Duyệt & Khóa dữ liệu (Confirm)"
      log_step4_desc: "Sau khi kiểm tra số liệu, bấm 'Xác nhận' từng phòng hoặc 'Duyệt tất cả' cho kỳ tháng. Chỉ số đã duyệt sẵn sàng được hệ thống tự động đưa vào hóa đơn tiền phòng."
      workflow_title: "Quy trình vận hành khép kín hàng tháng"
      workflow_step1: "1. Cuối kỳ ghi số: Khách thuê hoặc Chủ nhà ghi nhận chỉ số công tơ điện nước kèm ảnh chụp thực tế."
      workflow_step2: "2. Kiểm tra & Duyệt: Chủ nhà xác nhận tính chính xác và đối chiếu ảnh chụp công tơ."
      workflow_step3: "3. Lập Hóa đơn tự động: Khi bấm 'Tạo hóa đơn' hàng tháng, hệ thống tự động kéo các chỉ số dịch vụ đã duyệt vào hóa đơn từng phòng mà không cần gõ lại."
      workflow_step4: "4. Khóa chống sửa xóa: Sau khi xuất hóa đơn, chỉ số chuyển sang trạng thái 'Đã lập hóa đơn' và được bảo vệ để số liệu luôn khớp với hóa đơn đã gửi khách."
      tips_title: "Lưu ý thực tế cho Chủ nhà"
      tip1_title: "Khách thuê tự gửi chỉ số"
      tip1_desc: "Khách thuê có thể truy cập Cổng khách thuê (Tenant Portal) để tự gửi chỉ số và tải ảnh công tơ phòng mình hàng tháng. Chủ nhà chỉ cần duyệt trên hệ thống."
      tip2_title: "Kiểm tra tiêu thụ bất thường"
      tip2_desc: "Nếu lượng điện/nước nhảy vọt bất thường so với tháng trước, hãy kiểm tra lại ảnh chụp công tơ trước khi duyệt để kịp thời xử lý trường hợp rò rỉ hoặc nhập nhầm số."
      tip3_title: "Dịch vụ tính theo người"
      tip3_desc: "Với các dịch vụ tính theo đầu người (ví dụ: tiền nước 100k/người), hệ thống tự động nhân với số lượng khách đang ở thực tế trong hợp đồng của phòng đó."
