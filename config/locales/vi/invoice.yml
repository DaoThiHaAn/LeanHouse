    billing_cycle_title: "1. Chu kỳ hóa đơn (Billing Cycle)"
    billing_cycle_desc: "Tháng tính toán (ví dụ: 09/2026) là mốc chu kỳ ghi nhận khoản thu, được dùng để quản lý doanh thu, phân loại hóa đơn và phòng ngừa lập trùng hóa đơn trong cùng một tháng."
    rent_vs_service_title: "2. Tiền phòng (Trả trước) & Điện nước (Trả sau)"
    rent_vs_service_desc: "• Tiền phòng: Thường là khoản trả trước cho cả tháng được chọn (ví dụ từ 01/09 đến 30/09).\n• Điện, Nước, Dịch vụ đo đếm: Là khoản trả sau cho lượng tiêu thụ thực tế của chu kỳ vừa qua (ví dụ số điện dùng trong tháng 8 chốt vào đầu tháng 9)."
    auto_meter_sync_title: "3. Tự động lấy chỉ số gần nhất"
    auto_meter_sync_desc: "Hệ thống tự động tìm phiếu ghi chỉ số gần nhất trên hoặc trước tháng này để điền sẵn vào hóa đơn. Bạn cũng có thể sửa hoặc nhập trực tiếp chỉ số mới ngay tại bảng bên dưới mà không cần vào trang Ghi chỉ số trước."
    qr_code_sync_title: "4. Đồng bộ Mã hóa đơn & VietQR"
    qr_code_sync_desc: "Tháng tính toán sẽ được tự động tích hợp vào Mã hóa đơn (ví dụ: HD2609-...) và cú pháp chuyển khoản QR để đối soát tự động khi khách thanh toán."

    guide:
      btn_title: "Hướng dẫn lập hóa đơn"
      modal_title: "Cẩm nang & Quy trình Lập Hóa đơn Thu tiền"
      badge_subtitle: "Chuẩn vận hành • Minh bạch • Tự động hóa VietQR"
      tab_steps: "📋 Quy trình 4 Bước"
      tab_prepaid_postpaid: "💡 Trả trước vs Trả sau"
      tab_modes: "👥 Kiểu thanh toán"
      tab_vietqr: "🏦 Tự động hóa VietQR"
      step1_title: "Bước 1: Chọn Thông tin chung & Phòng thu"
      step1_desc: "• Tiêu đề hóa đơn: Đặt tên gợi nhớ (mặc định: Thu tiền hàng tháng).\n• Tháng tính toán: Chọn chu kỳ thu (ví dụ: 09/2026).\n• Phòng & Chế độ: Chọn phòng cần thu và hình thức (Cả phòng hoặc Tách riêng từng người/giường).\n• Hạn thanh toán: Thiết lập hạn cuối khách thuê cần hoàn tất đóng tiền."
      step2_title: "Bước 2: Kiểm tra Tiền phòng & Chỉ số Dịch vụ"
      step2_desc: "• Tiền phòng: Hệ thống tự động tính từ giá thuê niêm yết của phòng hoặc giường.\n• Điện / Nước / Dịch vụ đo đếm: Tự động tải chỉ số cũ và mới chốt gần nhất. Nếu chưa ghi chỉ số trước đó, bạn có thể gõ trực tiếp chỉ số mới ngay tại bảng để hệ thống tự động tính lượng tiêu thụ."
      step3_title: "Bước 3: Thêm Phụ phí (+) hoặc Giảm trừ (-) linh hoạt"
      step3_desc: "• Phụ phí (+): Bấm '+ Thêm khoản phụ phí' để cộng thêm tiền phát sinh (phí sửa chữa, gửi thêm xe, phạt trễ hạn...).\n• Giảm trừ (-): Bấm '- Thêm khoản giảm trừ' để trừ tiền ưu đãi (khuyến mãi, cấn trừ tiền cọc, hỗ trợ dịch bệnh...).\n• Đơn vị tính: Dễ dàng chọn đơn vị phù hợp từ danh sách tích hợp sẵn."
      step4_title: "Bước 4: Chọn Tài khoản Ngân hàng & Phát hành Hóa đơn"
      step4_desc: "• Tài khoản nhận tiền: Chọn tài khoản ngân hàng của bạn để hệ thống tự động tạo mã VietQR động chính xác từng đồng kèm cú pháp đối soát tự động.\n• Bấm 'Phát hành Hóa đơn': Hóa đơn được tạo, khóa tính bất biến và gửi thông báo tới khách thuê để thanh toán."
      prepaid_postpaid_title: "Quy tắc: Tiền phòng (Trả trước) vs Dịch vụ (Trả sau)"
      prepaid_postpaid_p1: "Trong quản lý nhà trọ chuyên nghiệp, các khoản thu có đặc thù thời gian khác nhau:"
      prepaid_point: "Tiền thuê phòng: Thường là khoản trả trước cho cả tháng sắp tới (ví dụ: ngày 01-05/09 thu tiền phòng cho tháng 9 từ 01/09 đến 30/09)."
      meter_sync_point: "Tự động lấy chỉ số: Ví dụ, khi lập hóa đơn tháng 9, hệ thống sẽ tự động tìm phiếu chốt chỉ số gần nhất (tháng 8 hoặc mới nhất) để điền vào hóa đơn mà bạn không cần tính toán thủ công."
      scenario_title: "Hướng dẫn thực tế: Các thời điểm lập hóa đơn phổ biến"
      scenario_badge: "Chỉ dẫn vận hành"
      scenario_subtitle: "Hệ thống hỗ trợ tối ưu cả 2 thời điểm lập hóa đơn mà các chủ nhà thường áp dụng:"
      scenario_beginning_title: "Tình huống 1: Lập hóa đơn vào ĐẦU THÁNG (Ví dụ: Ngày 01-05/09 - Tối ưu & Phổ biến nhất)"
      scenario_beginning_badge: "Tự động 100% • Không cần chỉnh tháng"
      scenario_beginning_desc: "• <strong>Bản chất</strong>: Thu trước tiền phòng tháng 9 (từ 01/09 đến 30/09) và thu sau tiền điện, nước thực tế đã dùng trong tháng 8 (từ 01/08 đến 31/08).\n• <strong>Hệ thống xử lý</strong>: Vì hôm nay là đầu tháng 9, ô 'Kỳ tính toán' đã được hệ thống tự động điền sẵn là <strong>09/2026</strong>. Tiền phòng tự động tính cho cả tháng 9; điện nước tự động tìm phiếu chốt chỉ số vừa ghi nhận của tháng 8 (phiếu gần nhất trước hoặc bằng tháng 9) để điền vào hóa đơn kèm ghi chú chu kỳ thực tế tháng 8.\n• <strong>Thao tác</strong>: Mở màn hình Tạo hóa đơn (giữ nguyên kỳ tháng 9 mặc định) ➔ Chọn phòng ➔ Kiểm tra bảng số liệu đã điền tự động ➔ Bấm 'Phát hành Hóa đơn'."
      scenario_monthend_title: "Tình huống 2: Lập hóa đơn vào CUỐI THÁNG (Ví dụ: Ngày 31/08)"
      scenario_monthend_badge: "Chốt sớm ngày cuối tháng"
      scenario_monthend_desc: "Khi dịch vụ điện, nước vừa được chốt xong vào ngày 31/08 và bạn muốn xuất hóa đơn ngay trong ngày này, bạn có 2 lựa chọn:\n• <strong>Lựa chọn A (Khuyên dùng - Tiền phòng trả trước)</strong>: Tại ô 'Kỳ tính toán', đổi từ tháng 8 sang tháng <strong>09/2026</strong>. Hệ thống sẽ tính tiền phòng cho tháng 9, đồng thời tự động lấy phiếu chỉ số tháng 8 vừa chốt ngày 31/08 vào hóa đơn.\n• <strong>Lựa chọn B (Quyết toán trọn gói kỳ tháng 8)</strong>: Giữ nguyên kỳ mặc định là <strong>08/2026</strong>. Hệ thống sẽ tính cả tiền phòng và tiền điện nước trong chu kỳ tháng 8."
      scenario_lock_title: "Cơ chế tự động khóa dữ liệu & Minh bạch số liệu khi Phát hành"
      scenario_lock_desc: "Ngay khi bấm 'Phát hành Hóa đơn', phiếu chỉ số điện nước liên quan sẽ được tự động liên kết với hóa đơn và chuyển sang trạng thái 'Đã lập hóa đơn' (khóa chống sửa/xóa). Nếu bạn nhập chỉ số trực tiếp ngay trên bảng hóa đơn mà chưa lập phiếu chỉ số trước, hệ thống sẽ tự động khởi tạo luôn một phiếu chỉ số đã duyệt và liên kết vào hóa đơn."
      modes_title: "Kiểu thanh toán: Đại diện phòng, Tự thanh toán & Thu phí tùy chọn"
      mode_room_point: "Kiểu Đại diện phòng (Cả phòng): Xuất 1 hóa đơn tổng cho cả phòng. Đại diện phòng chịu trách nhiệm thanh toán toàn bộ tiền phòng và phí dịch vụ chung."
      mode_individual_point: "Kiểu Tự thanh toán (Từng người): Xuất hóa đơn riêng cho từng khách thuê tự thanh toán. Tiền thuê tính theo giường (chế độ giường) hoặc chia đều theo số người đang ở (khi nhà ở kiểu Thuê theo phòng ); tiền dịch vụ chung tự động chia đều theo số người đang ở thực tế."
      mode_custom: "Thu phí tùy chọn"
      mode_custom_desc: "Tự do chọn người thuê & khoản phí"
      mode_custom_point: "Kiểu Thu phí tùy chọn: Cho phép xuất hóa đơn cho các người thuê bất kỳ trong nhà. Không ràng buộc tiền phòng hay dịch vụ định kỳ. Chủ nhà tự do thêm các khoản phụ phí (+) hoặc giảm trừ (-). Tất cả người thuê được chọn đều nhận cùng một nội dung hóa đơn với mã VietQR riêng biệt."
      mode_individual_room_split_note: "Lưu ý: Đối với phòng ở ghép (khi nhà ở kiểu Thuê theo phòng ), khi chọn kiểu Tự thanh toán cho từng cá nhân, tiền thuê phòng sẽ được hệ thống tự động chia đều cho số lượng người đang cư trú thực tế trong phòng."
      vietqr_title: "Tự động hóa Thanh toán & Đối soát với VietQR"
      vietqr_point1: "Mã QR Động: Mỗi hóa đơn được gắn mã VietQR tiêu chuẩn Napas 247 chứa chính xác số tiền cần thu."
      vietqr_point2: "Cú pháp chuyển khoản tự động: Hệ thống tạo sẵn cú pháp chuẩn (ví dụ: HD2609-101-ABCD), khách chỉ cần quét mã bằng bất kỳ app ngân hàng nào là thông tin tự động điền đủ."
      btn_got_it: "Bắt đầu lập hóa đơn"
      prepaid: "Tiền phòng (Thu trước)"
      postpaid: "Dịch vụ sử dụng (Thu sau)"
      auto_tranfer_note: "Cú pháp chuyển khoản tự động"
