    billing_cycle_title: "1. Chu kỳ hóa đơn (Billing Cycle)"
    billing_cycle_desc: "Tháng tính toán (ví dụ: 09/20xx) là mốc chu kỳ ghi nhận khoản thu, được dùng để quản lý doanh thu, phân loại hóa đơn và phòng ngừa lập trùng hóa đơn trong cùng một tháng."
    rent_vs_service_title: "2. Tiền phòng (Trả trước) & Dịch vụ (Trả sau)"
    rent_vs_service_desc: "• Tiền phòng: Thường là khoản trả trước cho cả tháng được chọn (ví dụ từ 01/09 đến 30/09).\n• Điện, Nước, Dịch vụ đo đếm: Là khoản trả sau cho lượng tiêu thụ thực tế của chu kỳ vừa qua (ví dụ số điện dùng trong tháng 8 chốt vào đầu tháng 9)."
    auto_meter_sync_title: "3. Tự động lấy chỉ số gần nhất"
    auto_meter_sync_desc: "Hệ thống tự động tìm phiếu ghi chỉ số gần nhất trên hoặc trước tháng này để điền sẵn vào hóa đơn. Bạn cũng có thể sửa hoặc nhập trực tiếp chỉ số mới ngay tại bảng bên dưới mà không cần vào trang Ghi chỉ số trước."
    qr_code_sync_title: "4. Đồng bộ Mã hóa đơn & VietQR"
    qr_code_sync_desc: "Tháng tính toán sẽ được tự động tích hợp vào Mã hóa đơn (ví dụ: HD26092026-...) và cú pháp chuyển khoản QR để đối soát tự động khi khách thanh toán."

    guide:
      btn_title: "Hướng dẫn lập hóa đơn"
      modal_title: "Cẩm nang & Quy trình Lập Hóa đơn Thu tiền"
      badge_subtitle: "Chuẩn vận hành • Minh bạch • Tự động hóa VietQR"
      tab_steps: "📋 Quy trình 4 Bước"
      tab_prepaid_postpaid: "💡 Trả trước vs Trả sau"
      tab_modes: "👥 2 Loại hóa đơn & Kiểu thanh toán"
      tab_vietqr: "🏦 Tự động hóa VietQR"
      step1_title: "Bước 1: Chọn Thông tin chung & Phòng thu"
      step1_desc: "• Tiêu đề hóa đơn: Đặt tên gợi nhớ (mặc định: Thu tiền hàng tháng).\n• Tháng tính toán: Chọn chu kỳ thu (ví dụ: 09/20xx).\n• Phòng & Chế độ: Chọn phòng cần thu và hình thức (Cả phòng hoặc Tách riêng từng người/giường).\n• Hạn thanh toán: Thiết lập hạn cuối khách thuê cần hoàn tất đóng tiền."
      step2_title: "Bước 2: Kiểm tra Tiền phòng & Chỉ số Dịch vụ"
      step2_desc: "• Tiền phòng: Hệ thống tự động tính từ giá thuê niêm yết của phòng hoặc giường.\n• Điện / Nước / Dịch vụ đo đếm: Tự động tải chỉ số cũ và mới chốt gần nhất. Nếu chưa ghi chỉ số trước đó, bạn có thể gõ trực tiếp chỉ số mới ngay tại bảng để hệ thống tự động tính lượng tiêu thụ."
      step3_title: "Bước 3: Thêm Phụ phí (+) hoặc Giảm trừ (-) linh hoạt"
      step3_desc: "• Phụ phí (+): Bấm '+ Thêm khoản phụ phí' để cộng thêm tiền phát sinh (phí sửa chữa, gửi thêm xe, phạt trễ hạn...).\n• Giảm trừ (-): Bấm '- Thêm khoản giảm trừ' để trừ tiền ưu đãi (khuyến mãi, cấn trừ tiền cọc, hỗ trợ dịch bệnh...).\n• Đơn vị tính: Dễ dàng chọn đơn vị phù hợp từ danh sách tích hợp sẵn."
      step4_title: "Bước 4: Chọn Tài khoản Ngân hàng & Phát hành Hóa đơn"
      step4_desc: "• Tài khoản nhận tiền: Chọn tài khoản ngân hàng của bạn để hệ thống tự động tạo mã VietQR động chính xác từng đồng kèm cú pháp đối soát tự động.\n• Bấm 'Phát hành Hóa đơn': Hóa đơn được tạo, khóa tính bất biến và gửi thông báo tới khách thuê để thanh toán."
      prepaid_postpaid_title: "Quy tắc: Tiền phòng (Trả trước) vs Dịch vụ (Trả sau)"
      prepaid_postpaid_p1: "Trong quản lý thuê trọ chuyên nghiệp, các khoản thu có đặc thù thời gian khác nhau (Lưu ý, việc lập hóa đơn và các khoản thu hoàn toàn phụ thuộc vào Chủ trọ, đây chỉ là tình huống phổ biến):"
      prepaid_point: "Tiền thuê phòng: thường là khoản trả trước cho cả tháng sắp tới (ví dụ: ngày 01-05/09 thu tiền phòng cho tháng 9 từ 01/09 đến 30/09)."
      postpaid_point: "Dịch vụ sử dụng: thường dựa vào chỉ số sử dụng thực tế trong tháng nên sẽ thu sau."
      meter_sync_point: "Tự động lấy chỉ số: Ví dụ, khi lập hóa đơn tháng 9, hệ thống sẽ tự động tìm phiếu chốt chỉ số gần nhất (tháng 8 hoặc mới nhất) để điền vào hóa đơn mà bạn không cần tính toán thủ công."
      scenario_title: "Hướng dẫn thực tế: Các thời điểm lập hóa đơn phổ biến"
      scenario_badge: "Chỉ dẫn vận hành"
      scenario_subtitle: "Hệ thống hỗ trợ tối ưu cả 2 thời điểm lập hóa đơn mà các chủ nhà thường áp dụng:"
      scenario_beginning_title: "Tình huống 1: Lập hóa đơn vào ĐẦU THÁNG (Ví dụ: Ngày 01-05/09 - Tối ưu & Phổ biến nhất)"
      scenario_beginning_badge: "Tự động 100% • Không cần chỉnh tháng"
      scenario_beginning_desc: "• <strong>Bản chất</strong>: Thu trước tiền thuê chỗ tháng 9 (từ 01/09 đến 30/09) và thu sau tiền dịch vụ sử dụng thực tế đã dùng trong tháng 8 (từ 01/08 đến 31/08).\n• <strong>Hệ thống xử lý</strong>: Vì hôm nay là đầu tháng 9, ô 'Kỳ tính toán' đã được hệ thống tự động điền sẵn là <strong>09/20xx</strong>. Tiền thuê chỗ tự động tính cho cả tháng 9; còn các dịch vụ tự động tìm phiếu chốt chỉ số vừa ghi nhận của tháng 8 (hoặc phiếu gần nhất trong hoặc trước tháng 9) để điền vào hóa đơn kèm ghi chú chu kỳ thực tế tháng 8.\n• <strong>Thao tác</strong>: Mở màn hình Tạo hóa đơn (giữ nguyên kỳ tháng 9 mặc định) ➔ Chọn phòng ➔ Kiểm tra bảng số liệu đã điền tự động ➔ Bấm 'Phát hành Hóa đơn'."
      scenario_monthend_title: "Tình huống 2: Lập hóa đơn vào CUỐI THÁNG (Ví dụ: Ngày 31/08)"
      scenario_monthend_badge: "Chốt sớm ngày cuối tháng"
      scenario_monthend_desc: "Khi dịch vụ được chốt xong vào ngày 31/08 và bạn muốn xuất hóa đơn ngay trong ngày này, bạn có 2 lựa chọn:\n• <strong>Lựa chọn A (Khuyên dùng - Tiền phòng trả trước)</strong>: Tại ô 'Kỳ tính toán', đổi từ tháng 8 sang tháng <strong>09/20xx</strong>. Hệ thống sẽ tính tiền phòng cho tháng 9, đồng thời tự động lấy phiếu chỉ số tháng 8 vừa chốt ngày 31/08 vào hóa đơn.\n• <strong>Lựa chọn B (Quyết toán trọn gói kỳ tháng 8)</strong>: Giữ nguyên kỳ mặc định là <strong>08/20xx</strong>. Hệ thống sẽ tính cả tiền thuê chỗ và tiền dịch vụ trong chu kỳ tháng 8."
      scenario_lock_title: "Cơ chế tự động khóa dữ liệu & Minh bạch số liệu khi Phát hành"
      scenario_lock_desc: "Ngay khi bấm 'Phát hành Hóa đơn', phiếu chỉ số dịch vụ liên quan sẽ được tự động liên kết với hóa đơn và chuyển sang trạng thái 'Đã lập hóa đơn' (khóa chống sửa/xóa). Nếu bạn nhập chỉ số trực tiếp ngay trên bảng hóa đơn mà chưa lập phiếu chỉ số trước, hệ thống sẽ tự động khởi tạo luôn một phiếu chỉ số đã duyệt và liên kết vào hóa đơn."
      modes_title: "2 Loại Hóa đơn & Kiểu thanh toán trong hệ thống"
      type_room_title: "1. Hóa đơn theo phòng (Định kỳ hàng tháng)"
      type_room_desc: "Bao gồm tiền phòng định kỳ, chỉ số điện/nước đo đếm thực tế và các dịch vụ cố định theo phòng."
      has_2_payment_modes: "Có 2 kiểu thanh toán"
      mode_room_title: "Kiểu Đại diện phòng"
