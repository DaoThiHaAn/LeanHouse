    example: "Ví dụ minh họa trên hóa đơn:"
    realtime_usage_title: "1. Dịch vụ đo theo công tơ / chỉ số thực tế (Real-time Usage)"
    realtime_usage_desc: "Bao gồm tất cả các dịch vụ có lắp đặt đồng hồ đo đạc riêng (ví dụ: Điện, Nước, Khí Gas, Trạm sạc xe, Nước nóng...) (lưu ý, trong thực tế, việc thiết lập dịch vụ phụ thuộc hoàn toàn vào chủ nhà). Lượng tiêu thụ được tính bằng:"
    fixed_usage_title: "2. Dịch vụ tính theo định mức cố định"
    fixed_usage_desc: "- Người: Nhân theo số lượng khách thuê đang lưu trú thực tế trong phòng.\n- Phòng: Tính trọn gói 1 suất cho cả phòng.\n- Tháng: Tính định mức cố định theo chu kỳ tháng.\n- Số lượng: Nhân theo số lượng tài sản, phương tiện hoặc hạng mục đăng ký.\n- Giờ: Tính theo số giờ sử dụng thực tế hoặc định mức thời gian.\n- Lần sử dụng: Tính theo số lượt hoặc lần phát sinh sử dụng trong kỳ.\n- kWh: Tính theo sản lượng điện năng tiêu thụ (theo công tơ hoặc định mức khoán).\n- m³: Tính theo khối lượng nước hoặc khí tiêu thụ (theo đồng hồ hoặc định mức khoán)."
    individual_split_title: "3. Phân chia khi ở chế độ Cá nhân (Individual)"
    individual_split_desc: "Khi xuất hóa đơn riêng cho từng người trong phòng ở ghép, tổng lượng tiêu thụ công tơ chung sẽ được chia đều cho số lượng người đang cư trú trong phòng đó."
    service_instructions_subtitle: "Quy chuẩn tính lượng tiêu thụ, định mức và chu kỳ áp dụng cho từng dịch vụ"
    usage_period_title: "4. Quy tắc xác định Chu kỳ / Khoảng thời gian sử dụng (Usage Period)"
    usage_period_desc: "Mỗi dòng dịch vụ trên hóa đơn đều hiển thị khoảng thời gian áp dụng rõ ràng (ví dụ: 01/09/20xx → 30/09/20xx) theo thứ tự ưu tiên 3 bước sau:"
    usage_period_tier1_badge: "Ưu tiên 1"
    usage_period_tier1_title: "Theo chu kỳ chốt công tơ thực tế (Điện, Nước)"
    usage_period_tier1_desc: "Nếu có phiếu ghi chỉ số công tơ, khoảng thời gian sẽ lấy chính xác theo ngày chốt của chu kỳ đó."
    usage_period_tier1_example: "Ví dụ: Chỉ số điện chốt từ 05/08 đến 05/09 → Hóa đơn hiển thị: 05/08/20xx → 05/09/20xx"
    usage_period_tier2_badge: "Ưu tiên 2"
    usage_period_tier2_title: "Theo ngày dọn vào ở giữa tháng (Hóa đơn theo ngày)"
    usage_period_tier2_desc: "Nếu khách dọn vào giữa tháng, khoảng thời gian sẽ tự động tính từ ngày bắt đầu ở đến cuối tháng."
    usage_period_tier2_example: "Ví dụ: Khách vào ở từ 15/09 → Hóa đơn hiển thị: 15/09/20xx → 30/09/20xx"
    usage_period_tier3_badge: "Ưu tiên 3"
    usage_period_tier3_title: "Theo trọn tháng tính toán (Wifi, Vệ sinh, Gửi xe)"
    usage_period_tier3_desc: "Dịch vụ tính theo tháng mặc định lấy từ ngày đầu tiên (01) đến ngày cuối cùng của tháng lập hóa đơn."
    usage_period_tier3_example: "Ví dụ: Hóa đơn tháng 09/20xx → Hóa đơn hiển thị: 01/09/20xx → 30/09/20xx"
    snapshot_note_title: "Tính chất Đóng băng (Snapshot) của Hóa đơn"
    snapshot_note_desc: "Khi hóa đơn được xuất, toàn bộ chỉ số dịch vụ và chu kỳ sử dụng được sao chép cố định vào hóa đơn. Việc điều chỉnh sổ chỉ số sau này sẽ không làm thay đổi các hóa đơn đã phát hành trước đó, đảm bảo tính minh bạch và pháp lý tài chính."
    unconfirmed_realtime_title: "5. Xử lý Chỉ số Chưa xác nhận hoặc Chưa ghi khi Lập Hóa đơn"
    unconfirmed_realtime_desc: "Hệ thống hỗ trợ quy trình duyệt và chốt số linh hoạt 1 chạm ngay trên hóa đơn nháp:"
    unconfirmed_case_pending_title: "Đã có chỉ số gửi lên nhưng chưa duyệt (Chờ xác nhận)"
    unconfirmed_case_pending_desc: "Hệ thống tự động điền sẵn chỉ số mới vào hóa đơn nháp. Khi chủ trọ bấm 'Lập hóa đơn', hệ thống sẽ tự động xác nhận (Auto-confirm), khóa chỉ số và liên kết vào hóa đơn mà không cần phải vào trang duyệt riêng."
    unconfirmed_case_missing_title: "Chưa có chỉ số của dịch vụ trong tháng"
    unconfirmed_case_missing_desc: "• Nhập trực tiếp: Chủ trọ có thể gõ chỉ số mới ngay tại bảng hóa đơn, hệ thống sẽ tự động tạo phiếu chỉ số đã xác nhận.\n• Tạm hoãn: Bỏ dấu tích chọn dịch vụ đó để xuất hóa đơn tiền phòng trước, tiền dịch vụ sẽ được thu ở kỳ tiếp theo."
