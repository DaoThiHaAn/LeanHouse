    billing_cycle_title: "1. Chu kỳ hóa đơn (Billing Cycle)"
    billing_cycle_desc: "Tháng tính toán (ví dụ: 09/2026) là mốc chu kỳ ghi nhận khoản thu, được dùng để quản lý doanh thu, phân loại hóa đơn và phòng ngừa lập trùng hóa đơn trong cùng một tháng."
    rent_vs_service_title: "2. Tiền phòng (Trả trước) & Điện nước (Trả sau)"
    rent_vs_service_desc: "• Tiền phòng: Thường là khoản trả trước cho cả tháng được chọn (ví dụ từ 01/09 đến 30/09).\n• Điện, Nước, Dịch vụ đo đếm: Là khoản trả sau cho lượng tiêu thụ thực tế của chu kỳ vừa qua (ví dụ số điện dùng trong tháng 8 chốt vào đầu tháng 9)."
    auto_meter_sync_title: "3. Tự động lấy chỉ số gần nhất"
    auto_meter_sync_desc: "Hệ thống tự động tìm phiếu ghi chỉ số gần nhất trên hoặc trước tháng này để điền sẵn vào hóa đơn. Bạn cũng có thể sửa hoặc nhập trực tiếp chỉ số mới ngay tại bảng bên dưới mà không cần vào trang Ghi chỉ số trước."
    qr_code_sync_title: "4. Đồng bộ Mã hóa đơn & VietQR"
    qr_code_sync_desc: "Tháng tính toán sẽ được tự động tích hợp vào Mã hóa đơn (ví dụ: HD2609-...) và cú pháp chuyển khoản QR để đối soát tự động khi khách thanh toán."
    guide:
      btn_title: "Hướng dẫn lập hóa đơn"
      modal_title: "Cẩm nang & Quy trình Lập Hóa đơn Thu tiền"
      badge_subtitle: "Chuẩn vận hành • Minh bạch • Tự động hóa VietQR"
      tab_steps: "📋 Quy trình 4 Bước"
      tab_prepaid_postpaid: "💡 Trả trước vs Trả sau"
      tab_modes: "👥 Cả phòng vs Từng khách"
      tab_vietqr: "🏦 Tự động hóa VietQR"
      step1_title: "Bước 1: Chọn Thông tin chung & Phòng thu"
      step1_desc: "• Tiêu đề hóa đơn: Đặt tên gợi nhớ (mặc định: Thu tiền hàng tháng).\n• Tháng tính toán: Chọn chu kỳ thu (ví dụ: 09/2026).\n• Phòng & Chế độ: Chọn phòng cần thu và hình thức (Cả phòng hoặc Tách riêng từng người/giường).\n• Hạn thanh toán: Thiết lập hạn cuối khách thuê cần hoàn tất đóng tiền."
      step2_title: "Bước 2: Kiểm tra Tiền phòng & Chỉ số Dịch vụ"
      step2_desc: "• Tiền phòng: Hệ thống tự động tính từ giá thuê niêm yết của phòng hoặc giường.\n• Điện / Nước / Dịch vụ đo đếm: Tự động tải chỉ số cũ và mới chốt gần nhất. Nếu chưa ghi chỉ số trước đó, bạn có thể gõ trực tiếp chỉ số mới ngay tại bảng để hệ thống tự động tính lượng tiêu thụ."
      step3_title: "Bước 3: Thêm Phụ phí (+) hoặc Giảm trừ (-) linh hoạt"
      step3_desc: "• Phụ phí (+): Bấm '+ Thêm khoản phụ phí' để cộng thêm tiền phát sinh (phí sửa chữa, gửi thêm xe, phạt trễ hạn...).\n• Giảm trừ (-): Bấm '+ Thêm khoản giảm trừ' để trừ tiền ưu đãi (khuyến mãi, cấn trừ tiền cọc, hỗ trợ dịch bệnh...).\n• Đơn vị tính: Dễ dàng chọn đơn vị phù hợp từ danh sách tích hợp sẵn."
      step4_title: "Bước 4: Chọn Tài khoản Ngân hàng & Phát hành Hóa đơn"
      step4_desc: "• Tài khoản nhận tiền: Chọn tài khoản ngân hàng của bạn để hệ thống tự động tạo mã VietQR động chính xác từng đồng kèm cú pháp đối soát tự động.\n• Bấm 'Phát hành Hóa đơn': Hóa đơn được tạo, khóa tính bất biến và gửi thông báo tới khách thuê để thanh toán."
      prepaid_postpaid_title: "Quy tắc: Tiền phòng (Trả trước) vs Điện nước (Trả sau)"
      prepaid_postpaid_p1: "Trong quản lý nhà trọ chuyên nghiệp, các khoản thu có đặc thù thời gian khác nhau:"
      prepaid_point: "Tiền thuê phòng: Thường là khoản trả trước cho cả tháng sắp tới (ví dụ: ngày 01-05/09 thu tiền phòng cho tháng 9 từ 01/09 đến 30/09)."
      postpaid_point: "Điện, Nước & Dịch vụ đo đếm: Là khoản trả sau cho mức tiêu thụ thực tế của tháng vừa qua (ví dụ: lượng điện dùng trong tháng 8 được chốt vào cuối tháng 8 / đầu tháng 9)."
      meter_sync_point: "Tự động lấy chỉ số: Khi lập hóa đơn tháng 9, hệ thống sẽ tự động tìm phiếu chốt chỉ số gần nhất (tháng 8 hoặc mới nhất) để điền vào hóa đơn mà bạn không cần tính toán thủ công."
      modes_title: "Chế độ: Cả phòng (Room) vs Từng khách (Individual)"
      mode_room_point: "Chế độ Cả phòng: Xuất 1 hóa đơn tổng cho cả phòng. Đại diện phòng chịu trách nhiệm thanh toán toàn bộ tiền phòng và phí dịch vụ chung."
      mode_individual_point: "Chế độ Tách riêng cá nhân (Ký túc xá / Ở ghép): Xuất hóa đơn riêng cho từng khách thuê. Tiền thuê tính đúng theo giường/hợp đồng của khách đó; tiền dịch vụ chung (điện, nước, wifi...) tự động chia đều theo số người đang ở thực tế."
      vietqr_title: "Tự động hóa Thanh toán & Đối soát với VietQR"
      vietqr_point1: "Mã QR Động: Mỗi hóa đơn được gắn mã VietQR tiêu chuẩn Napas 247 chứa chính xác số tiền cần thu."
      vietqr_point2: "Cú pháp chuyển khoản tự động: Hệ thống tạo sẵn cú pháp chuẩn (ví dụ: HD2609-101-ABCD), khách chỉ cần quét mã bằng bất kỳ app ngân hàng nào là thông tin tự động điền đủ."
      vietqr_point3: "Gạch nợ tức thì: Giảm thiểu tối đa sai sót nhầm lẫn và thời gian đối soát chuyển khoản thủ công."
      btn_got_it: "Bắt đầu lập hóa đơn"
    realtime_usage_title: "1. Dịch vụ đo theo công tơ / chỉ số thực tế (Real-time Usage)"
    realtime_usage_desc: "Bao gồm tất cả các dịch vụ có lắp đặt đồng hồ đo đạc riêng (ví dụ: Điện, Nước, Khí Gas, Trạm sạc xe, Nước nóng...). Lượng tiêu thụ được tính bằng:"
    fixed_usage_title: "2. Dịch vụ tính theo định mức cố định"
    fixed_usage_desc: "- Theo phòng/tháng: Tính trọn gói 1 suất cho cả phòng (ví dụ: Internet Wifi).\n- Theo đầu người: Nhân theo số lượng khách đang lưu trú thực tế trong phòng (ví dụ: Phí vệ sinh, rác).\n- Theo tài sản: Nhân theo số lượng phương tiện khách đăng ký (ví dụ: Phí gửi xe)."
    individual_split_title: "3. Phân chia khi ở chế độ Cá nhân (Individual)"
    individual_split_desc: "Khi xuất hóa đơn riêng cho từng người trong phòng ở ghép, tổng lượng tiêu thụ công tơ chung sẽ được chia đều cho số lượng người đang cư trú trong phòng đó."
