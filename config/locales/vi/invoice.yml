      tab_modes: "👥 2 Loại hóa đơn & Kiểu thanh toán"
      tab_vietqr: "🏦 Thanh toán & Xác nhận VietQR"
      timing_title: "Quy tắc Chu kỳ: Tiền phòng (Trả trước) vs Dịch vụ (Trả sau)"
      timing_p1: "Trong quản lý thuê trọ, các khoản thu có đặc thù thời gian khác nhau (Lưu ý, việc lập hóa đơn và các khoản thu hoàn toàn phụ thuộc vào Chủ trọ, đây chỉ là các tình huống phổ biến):"
      timing_rent_title: "Tiền thuê chỗ: Thường là khoản Trả trước"
      timing_rent_desc: "Thường là khoản trả trước cho cả tháng sắp tới (ví dụ: ngày 01-05/09 thu tiền phòng cho tháng 9 từ 01/09 đến 30/09)."
      timing_utility_title: "Dịch vụ sử dụng: Thường là khoản Trả sau"
      timing_utility_desc: "Thường dựa vào chỉ số sử dụng thực tế trong tháng vừa qua nên sẽ thu sau (ví dụ: hóa đơn tháng 9 thu tiền điện/nước dùng trong tháng 8)."
      scenario_title: "Các thời điểm nhận hóa đơn phổ biến từ Chủ nhà"
      scenario_badge: "Chu kỳ thực tế"
      scenario_subtitle: "Tùy theo thỏa thuận trong hợp đồng hoặc cách vận hành của chủ trọ, bạn thường nhận hóa đơn theo 1 trong 2 thời điểm sau:"
      scenario_beginning_title: "Tình huống 1: Nhận hóa đơn vào ĐẦU THÁNG (Ví dụ: Ngày 01-05/09 • Phổ biến nhất)"
      scenario_beginning_badge: "Chu kỳ lệch tháng"
      scenario_beginning_desc: "• <strong>Bản chất</strong>: Thu trước tiền thuê phòng tháng 9 (từ 01/09 đến 30/09) và thu sau tiền dịch vụ điện/nước sử dụng thực tế đã dùng trong tháng 8 (từ 01/08 đến 31/08).\n• <strong>Cách kiểm tra</strong>: Bạn xem cột 'Từ ngày - Đến ngày' trên từng dòng phí của hóa đơn để thấy rõ chu kỳ sử dụng tương ứng."
      scenario_monthend_title: "Tình huống 2: Nhận hóa đơn vào CUỐI THÁNG (Ví dụ: Ngày 31/08)"
      scenario_monthend_badge: "Chốt vào cuối tháng"
      scenario_monthend_desc: "• <strong>Bản chất</strong>: Chủ nhà chốt số lượng đã dùng thực tế vào ngày cuối tháng và xuất hóa đơn ngay trong ngày đó. Tùy theo thỏa thuận của chủ trọ, hóa đơn có thể tính tiền phòng cho tháng sắp tới (trả trước) hoặc quyết toán trọn gói các khoản phí theo kỳ tháng vừa kết thúc.\n• <strong>Lưu ý</strong>: Mọi khoản phí đều được ghi rõ khoảng thời gian tính toán minh bạch trên hóa đơn."
      cycle_dependency_title: "Lưu ý: Thời điểm và chu kỳ phụ thuộc vào Chủ trọ"
      cycle_dependency_desc: "Hệ thống hỗ trợ tính toán tự động và minh bạch, tuy nhiên <strong>thời điểm phát hành hóa đơn, hạn thanh toán và chu kỳ thu tiền cụ thể hoàn toàn phụ thuộc vào thỏa thuận giữa bạn và Chủ trọ trong Hợp đồng thuê phòng</strong>. Bạn luôn có thể kiểm tra chi tiết ngày bắt đầu - ngày kết thúc của từng dịch vụ trên hóa đơn."
      timing_meter_title: "Minh bạch chỉ số công tơ rõ ràng"
      timing_meter_desc: "Bảng chi tiết dịch vụ luôn thể hiện rõ: <strong>Chỉ số cũ</strong>, <strong>Chỉ số mới</strong>, và <strong>Lượng tiêu thụ thực tế</strong> (= Mới - Cũ) kèm đơn giá niêm yết để bạn dễ dàng đối chiếu với công tơ phòng."
      modes_title: "2 Loại Hóa đơn & Kiểu thanh toán trong tòa nhà"
      type_room_title: "1. Hóa đơn theo phòng (Định kỳ hàng tháng)"
      type_room_desc: "Bao gồm tiền phòng định kỳ và các dịch vụ sử dụng chung trong chu kỳ tháng."
      mode_representative_title: "Kiểu Đại diện phòng"
      mode_representative_desc: "Xuất 1 hóa đơn tổng cho cả phòng. Bạn đại diện phòng chịu trách nhiệm nhận và thanh toán toàn bộ cho phòng."
      mode_self_pay_title: "Kiểu Tự thanh toán"
      mode_self_pay_desc: "Mỗi người thuê (hoặc giường) nhận một hóa đơn riêng. Tiền phòng tính theo giường hoặc chia đều theo số người đang ở; tiền dịch vụ chung được chia đều cho số người đang ở thực tế."
      type_custom_title: "2. Hóa đơn thu phí tùy chọn (Phát sinh linh hoạt)"
      type_custom_desc: "Dành cho các khoản thu/chi phát sinh riêng biệt ngoài chu kỳ tiền phòng (phí gửi xe thêm, sửa chữa thiết bị, phạt vi phạm, hoàn tiền, cọc...)."
      custom_mode_desc: "Hóa đơn được lập riêng cho chính bạn với mã hóa đơn và mã VietQR riêng biệt để bạn tự thanh toán khoản của mình."
      vietqr_title: "Quy trình Thanh toán & Xác nhận 2 Bước đơn giản"
      vietqr_step1_title: "Bước 1: Quét mã VietQR"
      vietqr_step1_desc: "Mở ứng dụng ngân hàng hoặc ví điện tử bất kỳ, chọn 'Quét mã QR' và quét mã trên hóa đơn. Số tiền chính xác từng đồng và nội dung chuyển khoản được tự động điền sẵn.\n<strong>Lưu ý:</strong> Vui lòng giữ nguyên nội dung chuyển khoản để hệ thống và chủ nhà đối soát hóa đơn của bạn nhanh nhất."
      vietqr_step2_title: "Bước 2: Bấm 'Xác nhận đã thanh toán' trên hệ thống"
      vietqr_step2_desc: "Sau khi chuyển khoản thành công, quay lại trang hóa đơn và bấm nút <strong>'Xác nhận thanh toán'</strong>. Bạn có thể đính kèm ảnh chụp biên lai chuyển tiền để chủ nhà kiểm tra và đánh dấu đã thu tiền nhanh chóng."
      payos_realtime_title: "Tự động xác nhận tức thì (Real-time)"
      payos_realtime_desc: "Đối với các hóa đơn có biểu tượng payOS, sau khi chuyển khoản thành công từ 1-3 giây, hóa đơn sẽ tự động đổi sang trạng thái 'Đã thanh toán' mà bạn không cần phải bấm xác nhận hay gửi ảnh biên lai!"
      payos_intro_html: "Đối với các hóa đơn có biểu tượng %{badge}, ngay sau khi bạn hoàn tất chuyển khoản thành công trên ứng dụng ngân hàng:"
      payos_bullet_1_html: "Hệ thống sẽ <strong>tự động nhận diện thanh toán trong 1-3 giây</strong>."
      payos_bullet_2_html: "Trang hóa đơn sẽ lập tức cập nhật sang trạng thái <strong>\"Đã thanh toán\"</strong> mà không cần tải lại trang hay gửi ảnh biên lai chuyển tiền."
      payos_note_html: "*Lưu ý: Mã QR hiển thị trực tiếp trên hóa đơn là VietQR tĩnh. Để được tự động nhận diện thanh toán tức thì qua payOS, vui lòng mở liên kết thanh toán payOS."
      btn_close: "Đã hiểu"

