      step2_desc: "Trong menu quản trị payOS, chọn mục 'Tài khoản ngân hàng' -> 'Thêm tài khoản' và liên kết ngân hàng của bạn (MB Bank, ACB, BIDV, OCB hoặc KienlongBank) bằng cách xác thực theo hướng dẫn trên màn hình."
      step3_title: "Tạo Kênh thanh toán & Lấy Khóa API"
      step3_desc: "Vào mục 'Kênh thanh toán' -> 'Tạo kênh mới', chọn tài khoản ngân hàng đã liên kết ở bước 2. Sau khi tạo kênh thành công, bạn sẽ nhận được 3 thông số bảo mật:"
      step4_title: "Cấu hình Webhook URL trên payOS"
      step4_desc: "Tại trang chi tiết Kênh thanh toán trên payOS, tìm phần 'Cấu hình Webhook' và dán đường link sau vào:"
      step4_confirm_hint: "Sau khi dán link, bấm \"Xác nhận Webhook\" trên payOS để hoàn tất kết nối."
