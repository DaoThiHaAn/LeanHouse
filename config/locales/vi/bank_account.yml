      intro_desc: "Khi khách thuê quét mã VietQR và chuyển khoản, tiền chuyển thẳng vào tài khoản ngân hàng của bạn. Hệ thống sẽ tự động gạch nợ hóa đơn sang 'Đã thanh toán' ngay lập tức mà bạn không cần phải mở app ngân hàng kiểm tra sao kê hay bấm nút duyệt thủ công."
