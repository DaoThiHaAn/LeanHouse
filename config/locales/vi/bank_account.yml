      dev_env_warning_prod_note_html: "• <strong>Môi trường thật (Production):</strong> Link Webhook này sẽ <em>tự động đổi thành tên miền chính thức</em> của bạn (ví dụ: <code>https://tenmien.vn/webhooks/payos</code>)."
      dev_env_warning_local_note_html: "• <strong>Khi chạy thử ở máy cá nhân:</strong> Server payOS trên internet không thể gọi về IP nội bộ <code>127.0.0.1</code>. Để nhận webhook thật trên localhost, bạn có thể dùng ngrok (<code>ngrok http 3000</code>) hoặc cấu hình biến <code>PAYOS_WEBHOOK_URL</code>."
      prod_env_ready: "Webhook URL tự động nhận diện theo tên miền Production hiện tại."
      notes_title: "Các câu hỏi thường gặp"
      faq1_q: "• Tiền có bị giữ lại trên payOS không?"
      faq1_a: "Không. payOS là mô hình A2A (Account-to-Account). Tiền từ người thuê chuyển thẳng 100% vào tài khoản ngân hàng của bạn, không qua ví trung gian và không phát sinh phí chiết khấu."
      faq2_q: "• Nếu tôi dùng ngân hàng khác (Techcombank, Vietcombank,...)?"
      faq2_a: "Bạn vẫn thêm tài khoản bình thường. Hệ thống sẽ sử dụng mã VietQR tĩnh chuẩn, người thuê quét mã và bạn bấm duyệt thanh toán như trước đây."
      faq3_q: "• Webhook URL thay đổi như thế nào giữa Local và Production?"
      faq3_a: "Hệ thống tự động sử dụng tên miền thật của ứng dụng khi chạy trên máy chủ Production (ví dụ: https://tenmien.vn/webhooks/payos). Bạn chỉ cần sao chép đúng đường dẫn hiển thị tại đây."
      security_footer: "Thông tin khóa API của bạn được lưu trữ an toàn trong hệ thống."
      btn_got_it: "Đã hiểu, tiến hành cài đặt"
