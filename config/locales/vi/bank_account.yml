      modal_title: "Hướng dẫn cài đặt tự động gạch nợ payOS"
      free_badge: "Hỗ trợ gói miễn phí"
      supported_banks: "Hỗ trợ: MB Bank, ACB, BIDV, OCB, KienlongBank"
      intro_title: "Tự động gạch nợ trong 1-3 giây khi khách thanh toán"
      intro_desc: "Khi khách thuê quét mã VietQR và chuyển khoản, tiền chuyển thẳng vào tài khoản ngân hàng của bạn. Hệ thống sẽ tự động gạch nợ hóa đơn sang 'Đã thanh toán' ngay lập tức mà bạn không cần phải mở app ngân hàng kiểm tra sao kê hay bấm nút duyệt thủ công."
      steps_title: "4 Bước thiết lập đơn giản (Chỉ mất 3 phút)"
      step1_title: "Đăng ký tài khoản payOS"
      step1_desc: "Truy cập cổng thanh toán payOS (my.payos.vn) và đăng ký tài khoản hoàn toàn miễn phí."
      step1_btn: "Truy cập my.payos.vn"
      step2_title: "Liên kết tài khoản Ngân hàng"
      step2_desc: "Trong menu quản trị payOS, chọn mục 'Tài khoản ngân hàng' -> 'Thêm tài khoản' và liên kết ngân hàng của bạn (MB Bank, ACB, BIDV, OCB hoặc KienlongBank) bằng cách xác thực theo hướng dẫn trên màn hình."
      step3_title: "Tạo Kênh thanh toán & Lấy Khóa API"
      step3_desc: "Vào mục 'Kênh thanh toán' -> 'Tạo kênh mới', chọn tài khoản ngân hàng đã liên kết ở bước 2. Sau khi tạo kênh thành công, bạn sẽ nhận được 3 thông số bảo mật:"
      step4_title: "Cấu hình Webhook URL trên payOS"
      step4_desc: "Tại trang chi tiết Kênh thanh toán trên payOS, tìm phần 'Cấu hình Webhook' và dán đường link sau vào:"
      step4_confirm_hint: "Sau khi dán link, bấm \"Xác nhận Webhook\" trên payOS để hoàn tất kết nối."
      copy_btn: "Sao chép"
      copied_btn: "Đã chép!"
      webhook_note: "Đường dẫn Webhook an toàn giúp hệ thống nhận diện và tự động gạch nợ hóa đơn ngay khi khách thanh toán."
      dev_env_warning_title: "Cấu hình nhận thông báo gạch nợ:"
      dev_env_warning_prod_note_html: "Hệ thống tự động đồng bộ trạng thái hóa đơn ngay khi khách quét mã chuyển khoản."
      dev_env_warning_local_note_html: ""
      prod_env_ready: "Đường dẫn Webhook an toàn giúp hệ thống nhận diện và tự động gạch nợ hóa đơn ngay khi khách thanh toán."
      notes_title: "Các câu hỏi thường gặp"
      faq1_q: "Tiền có bị giữ lại trên payOS không?"
      faq1_a: "Không. payOS là mô hình A2A (Account-to-Account). Tiền từ người thuê chuyển thẳng 100% vào tài khoản ngân hàng của bạn, không qua ví trung gian và không phát sinh phí chiết khấu."
      faq2_q: "Nếu tôi dùng ngân hàng khác (Techcombank, Vietcombank,...)?"
      faq2_a: "Bạn vẫn thêm tài khoản bình thường. Hệ thống sẽ sử dụng mã VietQR tĩnh chuẩn, người thuê quét mã và bạn bấm duyệt thanh toán như trước đây."
      faq3_q: "Làm sao để biết tài khoản đã kết nối thành công?"
      faq3_a: "Sau khi điền đủ 3 khóa API và lưu lại, tài khoản sẽ hiển thị nhãn 'Tự động gạch nợ payOS'. Khi khách thuê chuyển khoản qua mã QR, hóa đơn sẽ tự động chuyển sang trạng thái 'Đã thanh toán' ngay lập tức mà không cần duyệt tay."
      faq4_q: "payOS có hoàn toàn miễn phí không? Hạn mức (quota) giao dịch như thế nào?"
      faq4_a: "payOS cung cấp các gói miễn phí ban đầu (như Free-100, Pioneer-500) hoặc gói đối tác (như KLB-1000 khi liên kết KienlongBank, tùy thuộc số lượng gói còn trong kho). Khi hết quota miễn phí hoặc với ngân hàng khác, bạn cần nhận thêm gói mới hoặc nâng cấp gói giao dịch trên my.payos.vn. Bạn nên thỉnh thoảng kiểm tra hạn mức còn lại và theo dõi các cập nhật chính sách mới nhất trên payOS để đảm bảo kết nối không bị gián đoạn."
      security_footer: "Thông tin khóa API của bạn được lưu trữ an toàn trong hệ thống."
      btn_got_it: "Đã hiểu, tiến hành cài đặt"
    errors:
      payos_unsupported_bank: "Ngân hàng này hiện chưa được hỗ trợ liên kết tự động qua payOS."
