  new_tel_owner:
    self: "Trợ giúp xác minh số điện thoại"
    title: "Xác minh số điện thoại"
    case_2: "Trường hợp 2: Bạn là chủ nhà đang tạo tài khoản mới cho Khách thuê"
    case_1: "Trường hợp 1: Bạn là chủ sở hữu số điện thoại"
    content_1: "Hệ thống thông báo ghi nhận số điện thoại đã được sử dụng có thể do chủ sở hữu trước đã dùng để đăng ký, để xác minh quyền sở hữu, bạn hãy làm theo các bước sau:"
    content_2_html: "<em>Bước 1</em>: Gửi tin nhắn đến số  <strong>1414</strong> (Số tổng đài miễn phí của các nhà mạng viễn thông tại Việt Nam) với cú pháp <strong>TTTB [Số CMND/CCCD]</strong>"
    content_3_html: "<em>Bước 2</em>: Chụp màn hình tin nhắn gửi và tin nhắn phản hồi như ảnh."
    content_4_html: "<em>Bước 3</em>: Gửi email đến chúng tôi qua <a class='text-decoration-underline' target='_blank' rel='noopener noreferrer' href='mailto:customerservice@leanhouse.com?subject=Trợ giúp xác nhận số điện thoại'>customerservice@leanhouse.com</a>. Trong email, hãy chèn ảnh chụp màn hình ở bước 2."
    content_4_1_html: "(<strong>Lưu ý</strong>: số điện thoại và số CCCD/CMND phải được hiển thị rõ ràng. Mọi thông tin cá nhân được cung cấp sẽ được bảo mật, chỉ dành cho mục đích xem xét minh chứng sở hữu số điện thoại và không được chia sẻ với bên thứ ba.)"
    fig_caption: "Hình ảnh minh họa tin nhắn và phản hồi xác thực số điện thoại chính chủ thành công"
    content_5: "Số điện thoại được xác nhận chính là số điện thoại được nhà mạng phản hồi lại trong tin nhắn đến."
    content_6: "Chúng tôi sẽ xử lý và phản hồi lại trong 1-2 ngày làm việc, không tính thứ bảy, chủ nhật và ngày lễ. Trong trường hợp chưa nhận được email, vui lòng kiểm tra thư mục Spam hoặc Thư rác."
    content_7: "Bạn hãy liên hệ với Khách thuê và hướng dẫn họ thực hiện các bước đã nêu trên, hoặc đổi sang số điện thoại mới."

