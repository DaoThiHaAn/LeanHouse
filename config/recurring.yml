production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

  # 1. Deep Night Silent Maintenance Batch (03:00 AM - 03:30 AM)
  sync_vietqr_banks:
    class: SyncVietqrBanksJob
    schedule: every monday at 2:55am

  contract_overdue_close:
    class: ContractOverdueCloseJob
    schedule: every day at 3:05am

  request_overdue_expire:
    class: RequestOverdueExpireJob
    schedule: every day at 3:20am

  cleanup_notifications:
    class: CleanupNotificationsJob
    args: [ { read_days: 30, unread_days: 180 } ]
    schedule: every day at 3:40am

  # Prepares notifications so users see fresh alerts right as they wake up.
  contract_due_reminder:
    class: ContractDueReminderJob
    schedule: every day at 4:00am

  contract_due_today:
    class: ContractDueTodayJob
    schedule: every day at 4:15am

  invoice_creation_reminder:
    class: InvoiceCreationReminderJob
    schedule: every day at 5:00am

  # Alerts landlords and tenants during active banking & payment hours.
  invoice_due_today:
    class: InvoiceDueTodayJob
    schedule: every day at 5:30am

  invoice_overdue_check:
    class: InvoiceOverdueCheckJob
    schedule: every day at 6:00am
